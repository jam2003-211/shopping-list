<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f3" />
    <meta name="description" content="買い忘れを防ぐ、シンプルな買い物リスト" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="買いもの" />
    <meta name="format-detection" content="telephone=no" />
    <title>買いものメモ</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">SHOPPING LIST</p>
        <div class="title-row">
          <div>
            <h1>買いものメモ</h1>
            <p class="date" id="today"></p>
          </div>
          <div class="bag-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img">
              <path d="M14 18h20l2 22H12l2-22Z" />
              <path d="M18 20v-5a6 6 0 0 1 12 0v5" />
            </svg>
          </div>
        </div>
      </header>

      <section class="list-section" aria-labelledby="list-heading">
        <div class="list-heading-row">
          <h2 id="list-heading">買うもの</h2>
          <p class="item-count" id="item-count" aria-live="polite">0 件</p>
        </div>

        <ul class="shopping-list" id="shopping-list"></ul>

        <div class="empty-state" id="empty-state">
          <div class="empty-icon" aria-hidden="true">✓</div>
          <p>リストは空です</p>
          <span>下の入力欄から商品を追加しましょう</span>
        </div>
      </section>

      <section class="add-panel" aria-labelledby="add-heading">
        <h2 class="sr-only" id="add-heading">商品を追加</h2>
        <form id="item-form" novalidate>
          <label class="sr-only" for="item-input">商品名</label>
          <div class="input-row">
            <input
              id="item-input"
              name="item"
              type="text"
              maxlength="80"
              placeholder="買うものを入力"
              autocomplete="off"
              enterkeyhint="enter"
              aria-describedby="input-error"
            />
            <button class="add-button" type="submit" aria-label="商品を追加">
              <span aria-hidden="true">＋</span>
              <span>追加</span>
            </button>
          </div>
          <p class="input-error" id="input-error" role="alert"></p>
        </form>
      </section>
    </main>

    <div class="undo-toast" id="undo-toast" role="status" aria-live="polite" hidden>
      <span>商品を削除しました</span>
      <button id="undo-button" type="button">元に戻す</button>
    </div>
  </body>
</html>
